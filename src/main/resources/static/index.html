<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTask</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div class="logo">✓</div><div><h1>SmartTask</h1><p>Make your day more manageable.</p></div></header>
<section class="hero"><small>PERSONAL TASK MANAGER</small><h2>Plan less. <span>Do more.</span></h2><p>Capture tasks, set priorities, and keep moving forward.</p></section>
<section class="stats"><div><small>Total tasks</small><b id="total">0</b></div><div><small>To do</small><b id="todo">0</b></div><div><small>Completed</small><b id="done">0</b></div></section>
<div class="layout"><section class="panel"><h3 id="formTitle">Add a task</h3><form id="taskForm"><input type="hidden" id="id"><label>Task title *</label><input id="title" required maxlength="150" placeholder="e.g. Finish Java assignment"><label>Description</label><textarea id="description" rows="3" placeholder="Add details (optional)"></textarea><div class="two"><div><label>Priority</label><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><div><label>Due date</label><input id="dueDate" type="date"></div></div><button class="primary" id="save">＋ Add task</button><button type="button" class="secondary hidden" id="cancel">Cancel</button></form></section>
<section class="panel"><div class="listhead"><h3>My tasks <span id="count">0</span></h3><select id="filter"><option value="ALL">All tasks</option><option value="ACTIVE">To do</option><option value="COMPLETED">Completed</option></select></div><p id="message"></p><div id="tasks">Loading tasks…</div></section></div><footer>SmartTask · Simple planning, steady progress</footer></main><script src="app.js"></script></body></html>
